<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grey+Qo&family=Orbitron&family=Spicy+Rice&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/components/developer.css">
</head>
<body>

    <audio id="bgm" src="assets/sounds/bgm.MP3" preload="auto" loop hidden></audio>
    <audio id="P1" src="assets/sounds/pika1.mp3" preload="auto" hidden></audio>
    <audio id="p1" src="assets/sounds/pichu1.MP3" preload="auto" hidden></audio>
    <audio id="oS1" src="assets/sounds/optionS.MP3" preload="auto" hidden></audio>
    <audio id="oS2" src="assets/sounds/optionS2.mp3" preload="auto" hidden></audio>

    <h1>TIC TAC TOE</h1>

    <div class="container">
        <img id="pikachu" src="assets/images/Pikachu-wbg.png" width="200">
        <img id="pichu" src="assets/images/Pichu.png" width="100">
        <div class="maindivs" id="card">
            <div id="gs">
                <p>Game Sounds</p>
                <div id="soundBar"></div>
            </div>
            <img id="settings" src="assets/images/settings2.svg" width="50">
            <img id="playB" src="assets/images/pikachuDI.svg" width="60"><br>
        </div>
    </div>

    <p class="developer" id="developer">Developed By Biraj Adhikari</p>
  
    <script src="scripts/sounds.js"></script>
    <script type="module" src="scripts/main.js"></script>

</body>
</html>
